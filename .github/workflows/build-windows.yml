name: Build and release Sayl.exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name Sayl --icon assets/icon.ico --collect-all yt_dlp run_sayl.py
      - uses: actions/upload-artifact@v4
        with:
          name: Sayl-windows
          path: dist/Sayl.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Sayl.exe
          generate_release_notes: true
