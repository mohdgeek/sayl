<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إعدادات سيل</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { max-width: 460px; margin: 0 auto; padding: 28px 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .steps { margin: 16px 0 4px; padding: 14px 16px; background: var(--surface); border-radius: 12px; line-height: 1.9; color: var(--sub); }
  .steps b { color: var(--text); }
  #status { margin-top: 12px; min-height: 18px; }
  .ok { color: var(--ok); } .bad { color: var(--err); }
</style>
</head>
<body>
  <h1>إعدادات سيل</h1>
  <div class="sub">اربط الإضافة بالبرنامج المثبّت على جهازك.</div>
  <div class="steps" id="statusbox"><b>الحالة:</b> <span id="conn">جارٍ الفحص…</span><br>الربط تلقائي: ثبّت الإضافة وشغّل سيل فقط، لا رمز ولا منفذ.</div>
  <details style="margin-top:14px"><summary style="cursor:pointer;color:#8D95AB">إعدادات متقدمة (اختيارية)</summary>
  <label class="field" for="token">رمز الإضافة</label>
  <input type="password" id="token" autocomplete="off" dir="ltr">
  <label class="field" for="port">المنفذ</label>
  <input type="number" id="port" value="6800" dir="ltr">
    <button class="btn" id="pair" type="button" style="margin-top:10px">ربط احتياطي عبر HTTP</button>
  </details>
  <label class="field" for="minSizeMB">تجاهل الملفات الأصغر من (ميغابايت)</label>
  <input type="number" id="minSizeMB" value="0" min="0" dir="ltr">
  <label class="check"><input type="checkbox" id="enabled"> اعتراض تحميلات Chrome تلقائيًا</label>
  <label class="check"><input type="checkbox" id="confirmVideo"> إظهار نافذة اختيار الجودة والمجلد قبل تحميل الفيديو</label>
  <label class="check"><input type="checkbox" id="confirmFiles"> إظهار نافذة تأكيد (الاسم والحجم والمجلد) قبل تحميل الملفات العادية</label>
  <button class="btn" id="save">حفظ واختبار الاتصال</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
